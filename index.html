
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIKE STORE - Free Fire</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
}

header {
  padding: 20px;
  text-align: center;
  color: #ffc928;
  font-size: 25px;
  font-weight: bold;
}

main {
  max-width: 420px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  background: #171f30;
  padding: 25px;
  border-radius: 16px;
  text-align: center;
}

h1 {
  color: #ffc928;
}

input, button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 9px;
  margin-top: 15px;
  font-size: 16px;
}

button {
  background: #ffc928;
  font-weight: bold;
  cursor: pointer;
}

footer {
  text-align: center;
  color: #8993a5;
  margin-top: 40px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>⚡ LIKE STORE</header>

<main>
  <div class="card">
    <h1>FREE FIRE LIKE</h1>
    <p>Selamat datang di LIKE STORE!</p>

    <input
      id="uid"
      placeholder="Masukkan UID Free Fire"
    >

    <button onclick="order()">
      ORDER NOW
    </button>

    <p id="result"></p>
  </div>

  <footer>LIKE STORE © 2026</footer>
</main>

<script>
function order() {
  const uid = document
    .getElementById("uid")
    .value.trim();

  const result =
    document.getElementById("result");

  if (!/^\d+$/.test(uid)) {
    result.textContent =
      "Masukkan UID yang benar!";
    return;
  }

  result.textContent =
    "UID diterima. Pengiriman like belum tersedia.";
}
</script>

</body>
</html>
